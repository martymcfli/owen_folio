    <link rel="icon" type="image/png" href="./favicon.png">
    <link rel="apple-touch-icon" href="./favicon.png">
    <title>Owen McCormick - Operations & Automation Portfolio</title>

    <script src="./lang.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #080c10;
            --bg-secondary: #1a2027;
            --bg-card: #1e252e;
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent-primary: #3B82F6;
            --accent-secondary: #2563EB;
            --accent-gradient: linear-gradient(135deg, #3B82F6 0%, #2563EB 50%, #1E40AF 100%);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.15);
            --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.3);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4), 0 2px 4px -2px rgb(0 0 0 / 0.3);
            --shadow-lg: 0 10px 25px -3px rgb(0 0 0 / 0.5), 0 4px 6px -4px rgb(0 0 0 / 0.4);
            --shadow-xl: 0 25px 50px -12px rgb(0 0 0 / 0.6), 0 8px 10px -6px rgb(59 130 246 / 0.3);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Starry night sky background */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Ensure all content sits above the starfield */
        .nav, .hero, section, footer, .separator, .off-the-clock, .faq-section {
            position: relative;
            z-index: 1;
        }

        ::selection {
            background: var(--accent-primary);
            color: white;
        }

        /* Navigation */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(15, 20, 25, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 40px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--text-primary);
        }

        .nav-cta {
            background: var(--accent-gradient);
            color: white;
            padding: 12px 24px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s ease;
            border-radius: 8px;
            box-shadow: var(--shadow-md);
        }

        .nav-cta:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        /* Rainbow glow on hover for all buttons */
        @keyframes rainbow-glow {
            0%   { box-shadow: 0 0 12px 2px rgba(255, 0, 0, 0.4); }
            16%  { box-shadow: 0 0 12px 2px rgba(255, 165, 0, 0.4); }
            33%  { box-shadow: 0 0 12px 2px rgba(255, 255, 0, 0.35); }
            50%  { box-shadow: 0 0 12px 2px rgba(0, 200, 100, 0.4); }
            66%  { box-shadow: 0 0 12px 2px rgba(0, 150, 255, 0.4); }
            83%  { box-shadow: 0 0 12px 2px rgba(160, 80, 255, 0.4); }
            100% { box-shadow: 0 0 12px 2px rgba(255, 0, 0, 0.4); }
        }
        .btn-primary:hover, .btn-secondary:hover, .nav-cta:hover {
            animation: rainbow-glow 3s linear infinite;
        }

        /* Hero Section */
        .hero {
            padding: 180px 40px 120px;
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: center;
        }

        .hero-content h1 {
            font-size: 4.5rem;
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .hero-content h1 span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-content p {
            font-size: 1.25rem;
            color: #c4d1e0;
            max-width: 500px;
            margin-bottom: 40px;
            line-height: 1.7;
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--accent-gradient);
            color: white;
            padding: 18px 32px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s ease;
            border-radius: 10px;
            box-shadow: var(--shadow-md);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-xl);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 18px 32px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-decoration: none;
            border: 2px solid var(--border-color);
            transition: all 0.3s ease;
            border-radius: 10px;
        }

        .btn-secondary:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .hero-image {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 0 auto;
            will-change: transform;
            transition: none;
        }

        .hero-image::before {
            content: 'Owen McCormick';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            color: rgba(255, 255, 255, 0.08);
            z-index: -1;
            text-align: center;
            line-height: 1.2;
            text-transform: uppercase;
            pointer-events: none;
        }

        .hero-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 52%;
            border-radius: 50%;
            border: 4px solid var(--accent-primary);
            transition: transform 0.5s ease;
        }

        .hero-image:hover img {
            transform: none;
        }

        .hero-badge {
            position: absolute;
            bottom: -10px;
            right: -10px;
            background: var(--accent-gradient);
            color: white;
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            text-align: center;
        }

        .hero-badge-title {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.05em;
        }

        .hero-badge-sub {
            font-size: 0.55rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            opacity: 0.9;
        }

        /* Separator */
        .separator {
            max-width: 1400px;
            margin: 0 auto;
            height: 1px;
            background: var(--border-color);
        }

        /* Skills Section */
        .skills {
            padding: 80px 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0;
        }

        .skill-card {
            padding: 40px;
            border-left: 3px solid var(--accent-primary);
            transition: all 0.3s ease;
            background: var(--bg-card);
            border-radius: 0 12px 12px 0;
        }

        .skill-card:hover {
            background: rgba(59, 130, 246, 0.08);
            transform: translateX(5px);
            box-shadow: var(--shadow-md);
        }

        .skill-icon {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .skill-icon-text {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: var(--accent-primary);
            border: 1px solid var(--accent-primary);
            border-radius: 4px;
            padding: 4px 8px;
            display: inline-block;
            width: auto;
            line-height: 1;
        }

        .skill-title {
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            margin-bottom: 10px;
        }

        .skill-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Projects Section */
        .projects {
            padding: 100px 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-tag {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--accent-primary);
            margin-bottom: 15px;
        }

        .section-title {
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }

        /* Filter Buttons */
        .filter-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 12px 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            border-radius: 8px;
        }

        .filter-btn:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .filter-btn.active {
            background: var(--accent-gradient);
            color: white;
            border-color: transparent;
            box-shadow: var(--shadow-md);
        }

        /* Project Grid */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
        }

        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
        }

        .project-card:hover {
            border-color: var(--accent-primary);
            transform: translateY(-8px);
            box-shadow: var(--shadow-xl);
        }

        .project-header {
            padding: 30px;
            border-bottom: 1px solid var(--border-color);
            border-radius: 16px 16px 0 0;
        }

        .project-category {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--accent-primary);
            margin-bottom: 10px;
        }

        .project-title {
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -0.01em;
            margin-bottom: 5px;
        }

        .project-company {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .project-body {
            padding: 30px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .project-desc {
            color: var(--text-secondary);
            margin-bottom: 25px;
            flex-grow: 1;
        }

        .project-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            padding: 20px;
            background: rgba(59, 130, 246, 0.08);
            border-left: 3px solid var(--accent-primary);
            border-radius: 0 12px 12px 0;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent-primary);
        }

        .stat-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 25px;
        }

        .tag {
            padding: 6px 12px;
            background: var(--bg-secondary);
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-secondary);
            border-radius: 6px;
        }

        .project-links {
            display: flex;
            gap: 12px;
        }

        .project-btn {
            flex: 1;
            text-align: center;
            padding: 14px 20px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .project-btn-primary {
            background: var(--accent-gradient);
            color: white;
            border-radius: 8px;
        }

        .project-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .project-btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        .project-btn-secondary:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        /* Experience Section */
        .experience {
            padding: 100px 40px;
            max-width: 1400px;
            margin: 0 auto;
            background: var(--bg-secondary);
            border-radius: 0;
        }

        .experience-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 80px;
        }

        .experience-intro h2 {
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            margin-bottom: 20px;
        }

        .experience-intro p {
            color: var(--text-secondary);
            line-height: 1.8;
        }

        .experience-list {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .experience-item {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 40px;
            padding-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
        }

        .experience-item:last-child {
            border-bottom: none;
        }

        .experience-date {
            font-size: 0.85rem;
            font-family: monospace;
            color: var(--text-muted);
        }

        .experience-content h3 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .experience-content h4 {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .experience-content p {
            color: var(--text-secondary);
            max-width: 600px;
        }

        /* Footer */
        .footer {
            background: linear-gradient(135deg, rgba(10, 15, 18, 0.85) 0%, rgba(15, 20, 25, 0.85) 100%);
            color: #f8fafc;
            padding: 100px 40px;
        }

        .footer-container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
        }

        .footer-content h2 {
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            margin-bottom: 25px;
        }

        .footer-content p {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            max-width: 500px;
        }

        .contact-info {
            margin-bottom: 30px;
        }

        .contact-info div {
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .contact-info a {
            color: #f8fafc;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .contact-info a:hover {
            color: #3B82F6;
        }

        .social-links {
            display: flex;
            gap: 20px;
        }

        .social-links a {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #f8fafc;
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        .social-links a:hover {
            color: #3B82F6;
            background: rgba(59, 130, 246, 0.1);
        }

        .footer-cta {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        .footer-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 18px 32px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s ease;
            width: fit-content;
        }

        .footer-btn-primary {
            background: var(--accent-gradient);
            color: white;
            border-radius: 10px;
        }

        .footer-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .footer-btn-secondary {
            background: transparent;
            color: #f8fafc;
            border: 2px solid rgba(248, 250, 252, 0.3);
            border-radius: 10px;
        }

        .footer-btn-secondary:hover {
            background: rgba(248, 250, 252, 0.1);
            border-color: rgba(248, 250, 252, 0.5);
        }

        .footer-brand {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
        }

        .footer-brand-logo {
            font-size: 10rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.05);
            line-height: 0.8;
        }

        /* Off the Clock - Music Section */
        .off-the-clock {
            padding: 100px 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .otc-label {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 40px;
        }

        .otc-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 60px;
            align-items: start;
            max-width: 500px;
            margin: 0 auto;
        }

        .otc-artist {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
        }

        .otc-artist img,
        .otc-artist video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .otc-artist-overlay {
            display: none;
        }

        .otc-artist-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.02em;
        }

        .otc-artist-tag {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.6);
            letter-spacing: 0.05em;
            margin-top: 2px;
        }

        .otc-player {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .otc-heading {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .otc-sub {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .track-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .track {
            display: grid;
            grid-template-columns: 48px 1fr auto;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 1px solid transparent;
        }

        .track:hover {
            background: rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.3);
        }

        .track.playing {
            background: rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.5);
        }

        .track-play-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .track:hover .track-play-btn {
